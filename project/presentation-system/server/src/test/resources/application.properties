spring.application.name=server
server.servlet.context-path=/api/v1

# H2 In-Memory Database (no PostgreSQL installation needed)
# MODE=PostgreSQL keeps SQL syntax compatible with the existing codebase
spring.datasource.url=jdbc:h2:mem:inventorydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secretKey=baufbaiwefaweufeaiufavisbvsdipisdnvaskjvskvpofpowaejrfposdkvnalsdvbafjbkujfewoifjwaajsbdifuauifbvdoivnoiehgoihervbikfbaiub

spring.jpa.hibernate.ddl-auto=create-drop

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 Console - view DB at http://localhost:8080/api/v1/h2-console while app is running
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
